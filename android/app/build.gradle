
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.playnex.app'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file(findProperty("PLAYNEX_STORE_FILE"))
            storePassword findProperty("PLAYNEX_STORE_PASSWORD")
            keyAlias findProperty("PLAYNEX_KEY_ALIAS")
            keyPassword findProperty("PLAYNEX_KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.playnex.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
